name: Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# THE ONE THING THIS NEEDS: a secret called METRICS_TOKEN, holding a classic
# PAT with `public_repo` + `read:user`. The contribution graph is only readable
# through the GraphQL API, and the built-in GITHUB_TOKEN cannot reach it - so
# without the PAT every panel below comes out empty or the step fails outright.
jobs:
  metrics:
    runs-on: ubuntu-latest
    strategy:
      # Each run commits its SVG straight to the repo, so they must not race.
      max-parallel: 1
      matrix:
        include:
          - theme: light
            suffix: ""
          - theme: dark
            suffix: "-dark"
    steps:
      # ------------------------------------------------------------------ #
      # 3D isometric contribution calendar
      # ------------------------------------------------------------------ #
      - name: Isometric contribution calendar (${{ matrix.theme }})
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.isocalendar${{ matrix.suffix }}.svg
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: ${{ matrix.theme }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ------------------------------------------------------------------ #
      # Coding habits: commits by hour of day and weekday, language activity
      # ------------------------------------------------------------------ #
      - name: Coding habits (${{ matrix.theme }})
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.habits${{ matrix.suffix }}.svg
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: ${{ matrix.theme }}
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # ------------------------------------------------------------------ #
      # Language breakdown, weighted by bytes
      # ------------------------------------------------------------------ #
      - name: Languages (${{ matrix.theme }})
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.languages${{ matrix.suffix }}.svg
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: ${{ matrix.theme }}
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used

      # ------------------------------------------------------------------ #
      # Achievement badges - the self-hosted replacement for
      # github-profile-trophy, whose public instance returns 402 (out of quota)
      # ------------------------------------------------------------------ #
      - name: Achievements (${{ matrix.theme }})
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.achievements${{ matrix.suffix }}.svg
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: ${{ matrix.theme }}
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
